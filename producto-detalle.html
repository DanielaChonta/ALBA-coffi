<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title th:text="${producto.nombre} + ' — ALBA coffi'">Detalle — ALBA coffi</title>
<link rel="icon" href="/img/logo-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-white text-dark">

<header th:replace="~{fragments/layout :: navbar}"></header>


<main class="flex-grow-1">
    <section class="py-5">
        <div class="container py-4">
            <div class="row g-5 align-items-center">
                <div class="col-12 col-md-6">
                    <img th:src="@{'/img/' + ${producto.imagen}}" th:alt="${producto.nombre}" class="img-fluid rounded shadow-sm w-100">
                </div>
                <div class="col-12 col-md-6">
                    <span class="badge bg-secondary-subtle text-dark border mb-2" th:text="${producto.categoria}">Categoría</span>
                    <span class="badge bg-warning text-dark mb-2" th:if="${producto.precio > 13}">
                        <i class="bi bi-star-fill"></i> Destacado
                    </span>
                    <h1 class="fw-normal fs-2" th:text="${producto.nombre}">Nombre</h1>
                    <p class="text-secondary" th:text="${producto.descripcion}">Descripción</p>
                    <p class="fs-3 fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">S/ 0.00</p>

                    <p>
                        <span class="badge bg-success" th:if="${producto.stock > 0}"
                              th:text="'Disponible (' + ${producto.stock} + ' unidades)'">Disponible</span>
                        <span class="badge bg-danger" th:if="${producto.stock == 0}">Agotado</span>
                    </p>

                    <div class="d-flex gap-2 mt-4">
                        <a th:href="@{/productos}" class="btn btn-outline-dark"><i class="bi bi-arrow-left"></i> Volver al menú</a>
                        <button type="button" class="btn btn-dark" th:disabled="${producto.stock == 0}">Comprar</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: modales}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
