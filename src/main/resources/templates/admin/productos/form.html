<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar producto — ALBA coffi</title>
<link rel="icon" href="/img/logo-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-white text-dark">

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="flex-grow-1">
    <section class="py-5">
        <div class="container py-4" style="max-width: 760px;">
            <h1 class="fw-normal fs-2 mb-4">Registrar producto</h1>
            <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post" class="row g-3" novalidate>
                <div class="col-12" th:if="${#fields.hasErrors('*')}">
                    <div class="alert alert-danger mb-0" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <strong>No se pudo guardar.</strong> Corrige los campos marcados en rojo.
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                           required minlength="3" maxlength="80">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label" for="imagen">Imagen (nombre del archivo, ej. espresso.jpg)</label>
                    <input type="text" id="imagen" class="form-control" th:field="*{imagen}"
                           th:classappend="${#fields.hasErrors('imagen')} ? 'is-invalid' : ''"
                           required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('imagen')}" th:errors="*{imagen}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label" for="descripcion">Descripción</label>
                    <textarea id="descripcion" rows="3" class="form-control" th:field="*{descripcion}"
                              th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''"
                              required minlength="5" maxlength="200"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label" for="precio">Precio (S/)</label>
                    <input type="number" id="precio" step="0.01" min="0.01" class="form-control" th:field="*{precio}"
                           th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid' : ''"
                           required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label" for="stock">Stock</label>
                    <input type="number" id="stock" min="0" class="form-control" th:field="*{stock}"
                           th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid' : ''"
                           required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label" for="categoria">Categoría</label>
                    <select id="categoria" class="form-select" th:field="*{categoria.id}"
                            th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid' : ''">
                        <option value="">Seleccione...</option>
                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label" for="proveedor">Proveedor</label>
                    <select id="proveedor" class="form-select" th:field="*{proveedor.id}"
                            th:classappend="${#fields.hasErrors('proveedor')} ? 'is-invalid' : ''">
                        <option value="">Seleccione...</option>
                        <option th:each="pr : ${proveedores}" th:value="${pr.id}" th:text="${pr.nombre}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('proveedor')}" th:errors="*{proveedor}"></div>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-dark">Guardar</button>
                    <a th:href="@{/admin/productos}" class="btn btn-outline-dark">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<div th:replace="~{fragments/layout :: modales}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
