<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categorías — ALBA coffi</title>
<link rel="icon" href="/img/logo-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-white text-dark">

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="flex-grow-1">
    <section class="py-5">
        <div class="container py-4">
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4">
                <h1 class="fw-normal fs-2 mb-0">Categorías</h1>
                <a th:href="@{/admin/categorias/nuevo}" class="btn btn-dark"><i class="bi bi-plus-lg"></i> Nueva categoría</a>
            </div>

            <div class="alert alert-success" th:if="${param.ok != null and param.ok[0] == 'registrado'}">Categoría registrada correctamente.</div>
            <div class="alert alert-success" th:if="${param.ok != null and param.ok[0] == 'actualizado'}">Categoría actualizada correctamente.</div>
            <div class="alert alert-success" th:if="${param.ok != null and param.ok[0] == 'eliminado'}">Categoría eliminada correctamente.</div>
            <div class="alert alert-danger" th:if="${param.error != null and param.error[0] == 'enuso'}">No se puede eliminar la categoría porque todavía tiene productos asociados.</div>
            <div class="alert alert-danger" th:if="${param.error != null and param.error[0] == 'noencontrado'}">La categoría solicitada ya no existe.</div>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr><th>ID</th><th>Nombre</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${categorias}">
                            <td th:text="${c.id}">1</td>
                            <td th:text="${c.nombre}">Nombre</td>
                            <td>
                                <div class="d-flex gap-1">
                                    <a th:href="@{/admin/categorias/{id}/editar(id=${c.id})}" class="btn btn-primary btn-sm"><i class="bi bi-pencil-square"></i> Editar</a>
                                    <form th:action="@{/admin/categorias/{id}/eliminar(id=${c.id})}" method="post">
                                        <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i> Eliminar</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<div th:replace="~{fragments/layout :: modales}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
