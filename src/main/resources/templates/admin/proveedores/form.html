<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proveedor — ALBA coffi</title>
<link rel="icon" href="/img/logo-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-white text-dark">

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="flex-grow-1">
    <section class="py-5">
        <div class="container py-4" style="max-width: 560px;">
            <h1 class="fw-normal fs-2 mb-4" th:text="${proveedor.id == null} ? 'Registrar proveedor' : 'Editar proveedor'">Proveedor</h1>
            <form th:action="${proveedor.id == null} ? @{/admin/proveedores/guardar} : @{/admin/proveedores/{id}/editar(id=${proveedor.id})}"
                  th:object="${proveedor}" method="post" class="row g-3" novalidate>
                <div class="col-12" th:if="${#fields.hasErrors('*')}">
                    <div class="alert alert-danger mb-0" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <strong>No se pudo guardar.</strong> Corrige los campos marcados en rojo.
                    </div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                           required minlength="3" maxlength="80">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label" for="telefono">Teléfono</label>
                    <input type="text" id="telefono" class="form-control" th:field="*{telefono}"
                           th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''"
                           required minlength="7" maxlength="15">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-dark">Guardar</button>
                    <a th:href="@{/admin/proveedores}" class="btn btn-outline-dark">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<div th:replace="~{fragments/layout :: modales}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
