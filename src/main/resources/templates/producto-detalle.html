<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle del producto — ALBA coffi</title>
<link rel="icon" href="/img/logo-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-white text-dark">

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="flex-grow-1">
    <section class="bg-white py-5">
        <div class="container py-4">
            <div class="row g-5 align-items-center justify-content-center">

                <div class="col-12 col-md-6 col-lg-5">
                    <img th:src="@{'/img/' + ${producto.imagen}}" th:alt="${producto.nombre}" alt="Producto"
                         class="img-fluid rounded shadow-sm w-100">
                </div>

                <div class="col-12 col-md-6 col-lg-5">
                    <span class="badge bg-secondary-subtle text-dark border me-1" th:text="${producto.categoria.nombre}">Categoría</span>
                    <span class="badge bg-warning text-dark" th:if="${producto.precio > 13}">
                        <i class="bi bi-star-fill"></i> Destacado
                    </span>

                    <h1 class="fw-normal fs-2 mt-3" th:text="${producto.nombre}">Nombre del producto</h1>
                    <p class="text-secondary" th:text="${producto.descripcion}">Descripción del producto</p>

                    <p class="small text-secondary mb-2">Proveedor: <span th:text="${producto.proveedor.nombre}">Proveedor</span></p>

                    <p class="fs-4 fw-bold mb-2" th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">S/ 0.00</p>

                    <p class="mb-4">
                        <span class="badge bg-success" th:if="${producto.stock > 0}"
                              th:text="'Disponible (' + ${producto.stock} + ' unidades)'">Disponible</span>
                        <span class="badge bg-danger" th:if="${producto.stock == 0}">Agotado</span>
                    </p>

                    <div class="d-flex gap-2">
                        <a th:href="@{/productos}" class="btn btn-outline-dark btn-sm">&larr; Volver al menú</a>
                        <button type="button" class="btn btn-dark btn-sm" th:disabled="${producto.stock == 0}">Comprar</button>
                    </div>
                </div>

            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<div th:replace="~{fragments/layout :: modales}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
