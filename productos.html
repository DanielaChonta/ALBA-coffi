<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú — ALBA coffi</title>
<link rel="icon" href="/img/logo-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-white text-dark">


<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="flex-grow-1">
    <section id="menu" class="bg-white py-5">
        <div class="container py-5">
            <div class="text-center mb-5">
                <span class="text-secondary text-uppercase small fw-semibold">Nuestra carta</span>
                <h1 class="fw-normal mt-2 fs-2">Menú ALBA coffi</h1>
            </div>

            <div class="row g-4 mb-4">
                
                <div class="col-12 col-sm-6 col-lg-4" th:each="producto : ${productos}">
                    <div class="card h-100 border shadow-sm position-relative">

                        
                        <span class="badge bg-warning text-dark position-absolute top-0 start-0 m-2" style="z-index: 2;"
                              th:if="${producto.precio > 13}">
                            <i class="bi bi-star-fill"></i> Destacado
                        </span>

                        <div class="ratio ratio-4x3">
                           
                            <img th:src="@{'/img/' + ${producto.imagen}}" class="w-100 h-100 object-fit-cover rounded-top" th:alt="${producto.nombre}">
                        </div>
                        <div class="card-body d-flex flex-column">
                           
                            <span class="badge bg-secondary-subtle text-dark border mb-2 align-self-start" th:text="${producto.categoria}">Categoría</span>
                            <h5 class="card-title fw-bold" th:text="${producto.nombre}">Nombre del Producto</h5>
                            <p class="card-text small text-secondary" th:text="${producto.descripcion}">Descripción del producto...</p>

                            <div class="mb-3 d-flex align-items-center justify-content-between">
                                <span class="badge bg-dark fs-6" th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">S/ 0.00</span>
                                
                                <span class="badge bg-success" th:if="${producto.stock > 0}">Disponible</span>
                                <span class="badge bg-danger" th:if="${producto.stock == 0}">Agotado</span>
                            </div>

                            <div class="d-flex gap-2 mt-auto">
                               
                                <a th:href="@{/productos/{id}(id=${producto.id})}" class="btn btn-outline-dark btn-sm flex-fill">Ver detalles</a>
                                
                                <button type="button" class="btn btn-dark btn-sm flex-fill" th:disabled="${producto.stock == 0}">Comprar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: modales}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
