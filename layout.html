<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><title>Fragmentos compartidos</title></head>
<body>

<header th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/index.html">
                <img src="/img/logo-icon-claro.png" alt="Logo ALBA coffi" height="40" class="me-2">
                <span class="fs-4">ALBA <em>coffi</em></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAlma"
                    aria-controls="menuAlma" aria-expanded="false" aria-label="Alternar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuAlma">
                <ul class="navbar-nav ms-auto mb-3 mb-lg-0 align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="/galeria.html">Galería</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/productos">Menú</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contacto.html">Contacto</a></li>
                    <li class="nav-item ms-lg-3">
                        <button type="button" class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#modalLogin">
                            Iniciar sesión
                        </button>
                    </li>
                    <li class="nav-item mt-2 mt-lg-0 ms-lg-2">
                        <button type="button" class="btn btn-light btn-sm text-dark" data-bs-toggle="modal" data-bs-target="#modalRegistro">
                            Crear cuenta
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>


<footer th:fragment="footer" class="bg-dark text-white-50 py-4 mt-auto">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
        <div class="d-flex align-items-center">
            <img src="/img/logo-icon-claro.png" alt="Logo ALBA coffi" height="32" class="me-2">
            <span class="text-white">ALBA coffi</span>
        </div>
        <ul class="list-inline mb-0 small">
            <li class="list-inline-item"><a class="link-light text-decoration-none" href="/index.html">Inicio</a></li>
            <li class="list-inline-item ms-3"><a class="link-light text-decoration-none" href="/nosotros.html">Nosotros</a></li>
            <li class="list-inline-item ms-3"><a class="link-light text-decoration-none" href="/productos">Menú</a></li>
            <li class="list-inline-item ms-3"><a class="link-light text-decoration-none" href="/contacto.html">Contacto</a></li>
        </ul>
        <div class="small">&copy; 2026 ALBA coffi</div>
    </div>
</footer>


<div th:fragment="modales">
<div class="modal fade" id="modalLogin" tabindex="-1" aria-labelledby="modalLoginLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLoginLabel">Iniciar sesión</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form class="row g-3">
                        <div class="col-12">
                            <label class="form-label" for="loginCorreo">Correo electrónico</label>
                            <input type="email" class="form-control" id="loginCorreo" placeholder="ejemplo@correo.com">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="loginPassword">Contraseña</label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="Tu contraseña">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-dark">Iniciar sesión</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalRegistro" tabindex="-1" aria-labelledby="modalRegistroLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalRegistroLabel">Crear cuenta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form class="row g-3">
                        <div class="col-12">
                            <label class="form-label" for="registroNombre">Nombre completo</label>
                            <input type="text" class="form-control" id="registroNombre" placeholder="Tu nombre completo">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="registroCorreo">Correo electrónico</label>
                            <input type="email" class="form-control" id="registroCorreo" placeholder="ejemplo@correo.com">
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label" for="registroPassword">Contraseña</label>
                            <input type="password" class="form-control" id="registroPassword" placeholder="Crea una contraseña">
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label" for="registroPassword2">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="registroPassword2" placeholder="Repite la contraseña">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-dark">Crear cuenta</button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
